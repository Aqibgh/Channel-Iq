[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/app/logs/nginx-stdout.log
stderr_logfile=/app/logs/nginx-stderr.log
user=root

[program:django]
command=/opt/venv/bin/gunicorn --bind 127.0.0.1:8000 --workers 9 --threads 3 --worker-class gthread --worker-connections 200 --max-requests 5000 --max-requests-jitter 500 --timeout 300000 --graceful-timeout 180000 --keep-alive 5 --preload --worker-tmp-dir /dev/shm --access-logfile /app/logs/gunicorn-access.log --error-logfile /app/logs/gunicorn-error.log --log-level info --capture-output --enable-stdio-inheritance backend.wsgi:application
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/django-stdout.log
stderr_logfile=/app/logs/django-stderr.log
user=appuser
environment=PATH="/opt/venv/bin:%(ENV_PATH)s",NLTK_DATA="/app/data/nltk_data",MPLCONFIGDIR="/app/data/matplotlib",TRANSFORMERS_CACHE="/app/data/transformers",HF_HOME="/app/data/huggingface",TORCH_HOME="/app/data/torch",HOME="/home/appuser",PYANNOTE_DATABASE_CONFIG="/app/data/pyannote/database.yml"