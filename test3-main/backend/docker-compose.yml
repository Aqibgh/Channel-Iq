version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      - PYTHONPATH=/app
      - GUNICORN_WORKERS=8
      - GUNICORN_THREADS=3
      - GUNICORN_MAX_REQUESTS=3000
      - GUNICORN_MAX_REQUESTS_JITTER=300
      # GPU optimizations
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
      - sqlite_data:/app/data
      - ./firebase_credential.json:/app/firebase_credential.json:ro
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 32G  # Increased for 48GB RAM server
          cpus: '7.0'  # Use 7 out of 9 vCPUs, leaving 2 for system
        reservations:
          memory: 8G   # Higher reservation for GPU workloads
          cpus: '4.0'
      # GPU access for Docker Compose
      runtime: nvidia
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=10)\" || exit 1"]
      interval: 45s
      timeout: 20s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"  # Increased log size for GPU server
        max-file: "5"
    ulimits:
      nofile:
        soft: 131072  # Increased file limits
        hard: 131072
      memlock:
        soft: -1      # Required for GPU memory allocation
        hard: -1
    shm_size: '4gb'   # Increased shared memory for GPU operations

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - logs_volume:/var/log/nginx
      - ./certbot/www:/var/www/certbot
      - /tmp/nginx_cache:/var/cache/nginx
    depends_on:
      web:
        condition: service_started
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 2G    # Increased for better caching
          cpus: '1.0'   # Increased CPU allocation
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health/ || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"  # Increased log size
        max-file: "5"

volumes:
  sqlite_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/app_data/sqlite
  static_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/app_data/static
  media_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/app_data/media
  logs_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/app_data/logs

networks:
  app_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-django-app
      com.docker.network.driver.mtu: 1500
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1