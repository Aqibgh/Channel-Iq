# nginx.conf - Optimized for 8GB/4CPU droplet - Let Django handle CORS

upstream django {
    server web:8000;
    keepalive 32;  # Increased from 16 for better connection pooling
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=web:10m rate=15r/s;  # Increased from 10r/s
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;  # Separate zone for API
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;  # Auth endpoints

# Cache configuration for better performance
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=app_cache:50m max_size=2g inactive=24h use_temp_path=off;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

server {
    listen 80;
    server_name channel-iq.nzxtsol.com www.channel-iq.nzxtsol.com;

    # Client optimizations
    client_max_body_size 100M;  # Increased for file uploads
    client_body_buffer_size 2m;
    client_body_timeout 120s;
    client_header_timeout 120s;

    # ACME challenge location for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Health check - optimized
    location /health/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }

    # Static files with enhanced caching
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;  # Increased from 7d
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Vary Accept-Encoding;
        
        # Specific caching for different file types
        location ~* \.(css|js)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 90d;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;  # Increased from 1d
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name channel-iq.nzxtsol.com www.channel-iq.nzxtsol.com;

    # SSL Configuration - Enhanced
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;  # Increased from 10m
    ssl_session_timeout 1d;  # Increased from 10m
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Enhanced Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client optimizations
    client_max_body_size 100M;
    client_body_buffer_size 2m;
    client_body_timeout 120s;
    client_header_timeout 120s;

    # Proxy optimizations
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_busy_buffers_size 16k;

    # Static files with enhanced caching
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        
        location ~* \.(css|js)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 90d;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    # Health check - no rate limiting
    location /health/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }

    # API endpoints with optimized rate limiting - NO CORS headers (Django handles them)
    location /api/ {
        limit_req zone=api burst=50 nodelay;  # Increased burst capacity
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;  # Reduced from 100s
        proxy_read_timeout 300s;    # Reduced from 1000s
        proxy_send_timeout 300s;    # Reduced from 1000s
        
        # Enable caching for GET requests only
        proxy_cache app_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;
        
        # Bypass cache for non-GET methods
        proxy_cache_bypass $request_method != GET;
    }

    # Auth endpoints with strict rate limiting
    location ~ ^/(login|auth|admin|accounts)/ {
        limit_req zone=auth burst=10 nodelay;
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_Set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;  # No buffering for auth
    }

    # All other requests with general rate limiting
    location / {
        limit_req zone=web burst=30 nodelay;  # Increased burst capacity
        
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;  # Reduced from 100s
        proxy_read_timeout 180s;    # Reduced from 1000s
        proxy_send_timeout 180s;    # Reduced from 1000s
        
        # Connection keep-alive optimization
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Light caching for pages
        proxy_cache app_cache;
        proxy_cache_valid 200 2m;
        proxy_cache_use_stale updating;
        proxy_cache_bypass $cookie_sessionid $http_authorization;
    }
}